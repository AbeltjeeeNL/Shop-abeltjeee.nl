<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Gekke shop Abel</title>

    <!-- FAVICONS -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            
            background: linear-gradient(to right, #ff0000, #ff4d00, #ff7a00, #ffa500);

            cursor: pointer;
            overflow: hidden;
        }

        p {
            font-size: 1.5em;
            opacity: 0;
            transform: translateX(-100vw);
            animation: flyIn 1s forwards;
            color: black;
        }

        p:nth-child(1) {
            animation-delay: 0.3s;
        }

        p:nth-child(2) {
            animation-delay: 1.2s;
        }

        p:nth-child(3) {
            animation-delay: 2.1s;
        }

        @keyframes flyIn {
            0% {
                opacity: 0;
                transform: translateX(-100vw);
            }
            60% {
                transform: translateX(20px);
                opacity: 1;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div>
    <p>Das nou jammer, er staat niks te koop!</p>
    <p>Nu ben je helemaal voor niks naar deze website gegaan!</p>
    <p>Als je hier nu toch bent... Klik dan even op het scherm!!</p>
</div>

<audio id="klikGeluid" src="sound.mp3"></audio>

<script>
    const audio = document.getElementById("klikGeluid");

    document.body.addEventListener("click", () => {
        audio.currentTime = 0;
        audio.play();
    });
</script>

</body>
</html>
