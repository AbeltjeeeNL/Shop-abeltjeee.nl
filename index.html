<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Niks te koop</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 3em;
            color: white;
            opacity: 0;
            transform: translateX(-100vw);
            animation: vliegBinnen 1.5s ease-out forwards;
        }

        @keyframes vliegBinnen {
            0% {
                opacity: 0;
                transform: translateX(-100vw);
            }
            60% {
                opacity: 1;
                transform: translateX(20px);
            }
            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <h1>Das nou jammer, er staat niks te koop!!</h1>

    <audio id="geluid" autoplay>
        <source src="geluid.mp3" type="audio/mpeg">
    </audio>

    <script>
        // fallback voor browsers die autoplay blokkeren
        document.addEventListener('click', function() {
            document.getElementById('geluid').play();
        });
    </script>

</body>
</html>
